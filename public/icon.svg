<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Dungeon / Dragon Fire Radial Gradient -->
    <radialGradient id="dungeonBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="50%" stop-color="#140714" />
      <stop offset="100%" stop-color="#07070c" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="dragonScales" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="dungeonStone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="manaGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="fantasyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Medieval Shield / Dungeon Portal Background -->
  <circle cx="256" cy="256" r="240" fill="url(#dungeonBg)" stroke="url(#goldBorder)" stroke-width="14" />

  <!-- Inner Runic Ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 14" opacity="0.45"/>

  <!-- Ancient Dungeon Stone Ladder / Tower Ascent -->
  <g filter="url(#shadow)">
    <!-- Left Iron Rail -->
    <rect x="186" y="65" width="16" height="380" rx="8" fill="url(#dungeonStone)" stroke="#0f172a" stroke-width="2"/>
    <!-- Right Iron Rail -->
    <rect x="310" y="65" width="16" height="380" rx="8" fill="url(#dungeonStone)" stroke="#0f172a" stroke-width="2"/>
    <!-- Glowing Arcane Mana Rungs -->
    <rect x="186" y="105" width="140" height="12" rx="6" fill="url(#manaGlow)" />
    <rect x="186" y="155" width="140" height="12" rx="6" fill="url(#manaGlow)" />
    <rect x="186" y="205" width="140" height="12" rx="6" fill="url(#manaGlow)" />
    <rect x="186" y="255" width="140" height="12" rx="6" fill="url(#manaGlow)" />
    <rect x="186" y="305" width="140" height="12" rx="6" fill="url(#manaGlow)" />
    <rect x="186" y="355" width="140" height="12" rx="6" fill="url(#manaGlow)" />
    <rect x="186" y="405" width="140" height="12" rx="6" fill="url(#manaGlow)" />
  </g>

  <!-- Epic Red Dragon Coiling Around the Ladder -->
  <g filter="url(#shadow)">
    <!-- Dragon Wing (Left) -->
    <path d="M 230 180 Q 130 120 90 200 Q 150 210 180 250 Q 200 210 230 180 Z"
          fill="#991b1b" stroke="#f59e0b" stroke-width="3" opacity="0.85"/>

    <!-- Dragon Body -->
    <path d="M 345 95 C 445 140 435 240 325 265 C 170 300 160 380 250 445"
          fill="none" stroke="url(#dragonScales)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dragon Dorsal Spikes / Ridge -->
    <path d="M 345 95 C 445 140 435 240 325 265 C 170 300 160 380 250 445"
          fill="none" stroke="#fde047" stroke-width="7" stroke-dasharray="16 20" stroke-linecap="round" />

    <!-- Dragon Horned Head -->
    <g transform="translate(355, 90) rotate(15)">
      <!-- Left & Right Horns -->
      <path d="M -10 -5 Q -25 -35 -40 -40 Q -25 -20 -15 0 Z" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
      <path d="M 5 -10 Q 0 -40 -10 -50 Q 5 -25 15 0 Z" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
      <!-- Snout & Jaw -->
      <path d="M -20 15 Q 15 25 35 15 Q 35 -5 10 -15 Q -15 -15 -20 15 Z" fill="#b91c1c" stroke="#450a0a" stroke-width="2"/>
      <!-- Glowing Amber Eye -->
      <circle cx="0" cy="-2" r="5" fill="#fde047" filter="url(#fantasyGlow)"/>
      <ellipse cx="0" cy="-2" rx="1.5" ry="4" fill="#000"/>
      <!-- Fire Breath Sparks -->
      <path d="M 35 15 Q 55 12 70 8 M 38 18 Q 60 25 75 30" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Polyhedral d20 / Dungeon Die in Foreground -->
  <g transform="translate(85, 305)" filter="url(#shadow)">
    <!-- d20 Hexagonal / Triangular Polygon -->
    <polygon points="50,0 100,30 100,85 50,115 0,85 0,30" fill="#1e1b4b" stroke="#fbbf24" stroke-width="6"/>
    <!-- Triangular Facets -->
    <polygon points="50,0 100,30 50,55" fill="#312e81" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="100,30 100,85 50,55" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="100,85 50,115 50,55" fill="#3730a3" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="50,115 0,85 50,55" fill="#312e81" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="0,85 0,30 50,55" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="0,30 50,0 50,55" fill="#4338ca" stroke="#fbbf24" stroke-width="2"/>
    <!-- Number 20 on Center Face -->
    <text x="50" y="66" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="900" fill="#fde047" text-anchor="middle">20</text>
  </g>
</svg>